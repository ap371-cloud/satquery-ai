<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f2027"/>
      <stop offset="100%" style="stop-color:#203a43"/>
    </linearGradient>
    <linearGradient id="satGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#38ef7d"/>
      <stop offset="100%" style="stop-color:#11998e"/>
    </linearGradient>
    <radialGradient id="earthGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" style="stop-color:#4fc3f7"/>
      <stop offset="100%" style="stop-color:#01579b"/>
    </radialGradient>
  </defs>

  <rect width="256" height="256" rx="48" fill="url(#bg)"/>

  <!-- orbit -->
  <ellipse cx="128" cy="128" rx="86" ry="34" fill="none" stroke="#38ef7d" stroke-opacity="0.4" stroke-width="2.5" transform="rotate(-22 128 128)"/>

  <!-- Earth -->
  <circle cx="128" cy="128" r="40" fill="url(#earthGrad)"/>
  <ellipse cx="128" cy="128" rx="40" ry="15" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2" transform="rotate(-18 128 128)"/>

  <!-- Satellite -->
  <g transform="rotate(-30 128 128)">
    <circle cx="196" cy="58" r="9" fill="url(#satGrad)"/>
    <rect x="190" y="50" width="12" height="5" rx="1.5" fill="#38ef7d"/>
    <rect x="186" y="42" width="6" height="4" rx="1" fill="#11998e"/>
    <rect x="200" y="42" width="6" height="4" rx="1" fill="#11998e"/>
    <rect x="193" y="69" width="6" height="16" rx="2" fill="#11998e"/>
    <rect x="183" y="87" width="12" height="4" rx="1.5" fill="#38ef7d"/>
    <rect x="196" y="87" width="12" height="4" rx="1.5" fill="#38ef7d"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f2027"/>
      <stop offset="50%" style="stop-color:#203a43"/>
      <stop offset="100%" style="stop-color:#2c5364"/>
    </linearGradient>
    <linearGradient id="satGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#38ef7d"/>
      <stop offset="100%" style="stop-color:#11998e"/>
    </linearGradient>
    <radialGradient id="earthGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" style="stop-color:#4fc3f7"/>
      <stop offset="100%" style="stop-color:#01579b"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="400" fill="url(#bg)"/>

  <!-- grid overlay -->
  <g stroke="#ffffff" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="150" y1="0" x2="150" y2="400"/>
    <line x1="300" y1="0" x2="300" y2="400"/>
    <line x1="450" y1="0" x2="450" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="750" y1="0" x2="750" y2="400"/>
    <line x1="900" y1="0" x2="900" y2="400"/>
    <line x1="1050" y1="0" x2="1050" y2="400"/>
  </g>

  <!-- Earth -->
  <circle cx="940" cy="210" r="95" fill="url(#earthGrad)"/>
  <ellipse cx="940" cy="210" rx="95" ry="38" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5" transform="rotate(-12 940 210)"/>

  <!-- orbit ring -->
  <ellipse cx="940" cy="210" rx="150" ry="55" fill="none" stroke="#38ef7d" stroke-opacity="0.4" stroke-width="1.5" transform="rotate(-20 940 210)"/>

  <!-- Satellite -->
  <g transform="rotate(-30 940 210)">
    <circle cx="1120" cy="120" r="14" fill="url(#satGrad)"/>
    <rect x="1112" y="106" width="16" height="8" rx="2" fill="#38ef7d"/>
    <rect x="1106" y="96" width="8" height="6" rx="1" fill="#11998e"/>
    <rect x="1126" y="96" width="8" height="6" rx="1" fill="#11998e"/>
    <rect x="1116" y="136" width="8" height="22" rx="2" fill="#11998e"/>
    <rect x="1100" y="158" width="16" height="5" rx="2" fill="#38ef7d"/>
    <rect x="1124" y="158" width="16" height="5" rx="2" fill="#38ef7d"/>
    <line x1="1120" y1="134" x2="1120" y2="210" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1" stroke-dasharray="4 4"/>
  </g>

  <!-- Title -->
  <text x="60" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="58" font-weight="700" fill="#ffffff">SatQuery AI</text>
  <text x="60" y="210" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="300" fill="#b8d8c9">Earth Intelligence Copilot</text>

  <rect x="60" y="245" width="520" height="3" rx="1.5" fill="url(#satGrad)"/>

  <!-- Tagline -->
  <text x="60" y="285" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" fill="#e8f5e9" font-weight="300">
    <tspan x="60" dy="0">Natural language x Satellite EO workflows</tspan>
    <tspan x="60" dy="30">Flood detection &middot; Change detection &middot; Vegetation &middot; Vision QA</tspan>
  </text>
</svg>
